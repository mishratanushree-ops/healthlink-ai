name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Image
        run: |
          docker build -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/healthlink-repo/healthlink-ai:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/healthlink-repo/healthlink-ai:${{ github.sha }}

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy healthlink-ai \
            --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/healthlink-repo/healthlink-ai